# The Device Layer — self-hosted newsletter stack
# Listmonk (app) + PostgreSQL (list at rest, on your disk) + Caddy (TLS).
# Delivery goes out through Amazon SES via SMTP — configured inside Listmonk.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: listmonk
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 10s
      timeout: 5s
      retries: 6

  listmonk:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Etc/UTC}
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${POSTGRES_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
    volumes:
      - ./data/uploads:/listmonk/uploads
    # First run only, to create the schema and admin user:
    #   docker compose run --rm listmonk ./listmonk --install
    expose:
      - "9000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - listmonk
    environment:
      DOMAIN: ${DOMAIN:?set in .env, e.g. news.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
